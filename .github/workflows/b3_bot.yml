name: Executar Robo IA B3 Opcoes

on:
  schedule:
    # ⏰ Cron configurado para rodar de hora em hora (Minuto 0)
    # Das 13:00 UTC às 21:00 UTC -> Equivale a 10:00h até 18:00h de Brasília
    # Atua estritamente de Segunda a Sexta-feira durante o pregão ativo
    - cron: '0 13-21 * * 1-5'
  
  # Permite que você ative o robô manualmente pelo site do GitHub quando quiser
  workflow_dispatch:

jobs:
  rodar-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Coletar codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar o Python no servidor
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias do projeto
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar o Robo B3 Opcoes
      run: python robo_opcoes_b3.py
