name: Executar Robo IA B3 Opcoes

on:
  schedule:
    - cron: '0 13-21 * * 1-5'
  
  workflow_dispatch:

jobs:
  rodar-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Coletar codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar o Python no servidor
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias do projeto
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar o Robo B3 Opcoes
      run: python robo_opcoes_b3.py
