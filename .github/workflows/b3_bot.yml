name: Executar Robo IA B3 Opcoes

on:
  schedule:
    # Executa às 18:30 UTC (15:30 no Horário de Brasília) de Segunda a Sexta-feira
    - cron: '30 18 * * 1-5'
  
  # Permite ativar o robô manualmente pelo site do GitHub
  workflow_dispatch:

jobs:
  rodar-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Coletar codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar o Python no servidor
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias do projeto
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar o Robo B3 Opcoes
      run: python robo_opcoes_b3.py

